<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --panel: #0d1117;
    --border: #1c2a3a;
    --accent: #00d4ff;
    --accent2: #00ff9d;
    --warn: #ffb800;
    --danger: #ff4060;
    --text: #c9d8e8;
    --muted: #4a6278;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Exo 2', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 24px;
    background-image:
      radial-gradient(ellipse at 10% 0%, rgba(0,212,255,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 90% 100%, rgba(0,255,157,0.04) 0%, transparent 60%);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .logo { display: flex; align-items: center; gap: 12px; }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  h1 {
    font-family: var(--sans);
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
  }

  .subtitle { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 2px; }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  .status-dot.live { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); animation: pulse 2s infinite; }
  .status-dot.error { background: var(--danger); }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .interval-select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.75rem;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
  }

  #error-msg {
    display: none;
    background: rgba(255,64,96,0.1);
    border: 1px solid rgba(255,64,96,0.3);
    color: var(--danger);
    padding: 16px 20px;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 0.85rem;
    margin-bottom: 20px;
    line-height: 1.6;
  }

  #gpu-container { display: flex; flex-direction: column; gap: 24px; }

  .gpu-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  /* Only animate on first appearance */
  .gpu-card.first-render { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .gpu-header {
    padding: 16px 20px;
    background: rgba(0,212,255,0.04);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .gpu-name { font-size: 1rem; font-weight: 600; color: #fff; }
  .gpu-meta { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); margin-top: 3px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }

  .badge {
    font-family: var(--mono);
    font-size: 0.68rem;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid;
    letter-spacing: 0.05em;
  }

  .badge-blue  { color: var(--accent);  border-color: rgba(0,212,255,0.3);  background: rgba(0,212,255,0.07); }
  .badge-green { color: var(--accent2); border-color: rgba(0,255,157,0.3);  background: rgba(0,255,157,0.07); }
  .badge-warn  { color: var(--warn);    border-color: rgba(255,184,0,0.3);  background: rgba(255,184,0,0.07); }

  .gpu-stats {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat-cell { background: var(--panel); padding: 14px 18px; }

  .stat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: var(--mono);
    font-size: 1.1rem;
    color: var(--accent);
    transition: color 0.4s ease;
  }

  .stat-value.green  { color: var(--accent2); }
  .stat-value.warn   { color: var(--warn); }
  .stat-value.danger { color: var(--danger); }

  .bar-wrap {
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.6s ease, background-color 0.4s ease;
    background: var(--accent);
  }

  .bar-fill.green  { background: var(--accent2); }
  .bar-fill.warn   { background: var(--warn); }
  .bar-fill.danger { background: var(--danger); }

  .proc-section { padding: 0 0 8px; }

  .proc-title {
    padding: 12px 18px 8px;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .proc-count {
    background: rgba(0,212,255,0.15);
    color: var(--accent);
    border-radius: 10px;
    padding: 1px 7px;
    font-family: var(--mono);
    font-size: 0.7rem;
  }

  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 0.78rem; }

  thead th {
    padding: 6px 18px;
    text-align: left;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-weight: 400;
    border-bottom: 1px solid var(--border);
  }

  tbody tr { border-bottom: 1px solid rgba(28,42,58,0.5); transition: background 0.15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(0,212,255,0.04); }
  tbody td { padding: 9px 18px; color: var(--text); }

  td.pid  { color: var(--muted); }
  td.container { color: var(--accent); }
  td.name { color: #fff; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.mem  { color: var(--accent2); }
  td.type { color: var(--muted); font-size: 0.7rem; }

  .no-procs { padding: 16px 18px; font-family: var(--mono); font-size: 0.78rem; color: var(--muted); font-style: italic; }

  footer {
    margin-top: 32px;
    font-size: 0.68rem;
    color: var(--muted);
    font-family: var(--mono);
    text-align: center;
    letter-spacing: 0.05em;
  }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⬡</div>
    <div>
      <h1>GPU Monitor</h1>
      <div class="subtitle">NVIDIA-SMI Live Dashboard</div>
    </div>
  </div>
  <div class="status-bar">
    <div id="status-dot" class="status-dot"></div>
    <span id="status-text">Connecting…</span>
    <span>|</span>
    <span>Refresh:</span>
    <select class="interval-select" id="interval-select">
      <option value="1000">1s</option>
      <option value="2000" selected>2s</option>
      <option value="5000">5s</option>
      <option value="10000">10s</option>
    </select>
    <span id="last-updated">—</span>
  </div>
</header>

<div id="error-msg"></div>
<div id="gpu-container"><div style="color:var(--muted);font-family:var(--mono);font-size:.85rem;padding:20px 0;"><span class="spinner"></span> &nbsp;Fetching GPU data…</div></div>

<footer>
  Polling <span id="footer-url">/api/gpu</span> &nbsp;·&nbsp; NVIDIA-SMI Live Dashboard
</footer>

<script>
const API_URL = "/api/gpu";
let pollTimer = null;
let initialized = false; // track first render

function getInterval() {
  return parseInt(document.getElementById("interval-select").value, 10);
}

function pct(str) {
  if (!str || str === "N/A") return 0;
  return parseFloat(str.replace("%", "")) || 0;
}

function tempClass(str) {
  const v = parseFloat(str);
  if (isNaN(v)) return "";
  if (v >= 85) return "danger";
  if (v >= 70) return "warn";
  return "green";
}

function utilClass(p) {
  if (p >= 90) return "danger";
  if (p >= 70) return "warn";
  return "";
}

function memClass(p) {
  if (p >= 90) return "danger";
  if (p >= 75) return "warn";
  return "green";
}

function parseNum(str) {
  if (!str || str === "N/A") return null;
  return parseFloat(str.replace(/[^0-9.]/g, ""));
}

function memPct(used, total) {
  const u = parseNum(used), t = parseNum(total);
  if (!u || !t) return 0;
  return Math.round((u / t) * 100);
}

function powerPct(draw, limit) {
  const d = parseNum(draw), l = parseNum(limit);
  if (!d || !l) return 0;
  return Math.round((d / l) * 100);
}

// Build the initial card HTML (only called once per GPU)
function buildGPUCard(g, idx) {
  const gpuPct = pct(g.gpu_utilization);
  const mPct   = memPct(g.memory_used, g.memory_total);
  const pwrPct = powerPct(g.power_draw, g.power_limit);
  const tc = tempClass(g.temperature);
  const uc = utilClass(gpuPct);
  const mc = memClass(mPct);
  const procs = g.processes || [];

  const procRows = buildProcRows(procs);

  return `
  <div class="gpu-card first-render" id="gpu-card-${idx}">
    <div class="gpu-header">
      <div>
        <div class="gpu-name">GPU ${g.id} &mdash; ${g.name}</div>
        <div class="gpu-meta">${g.uuid}</div>
      </div>
      <div class="badges" id="badges-${idx}">
        <span class="badge badge-blue">Driver ${g.driver_version}</span>
        <span class="badge badge-green">CUDA ${g.cuda_version}</span>
        ${procs.length > 0 ? `<span class="badge badge-warn" id="proc-badge-${idx}">${procs.length} process${procs.length > 1 ? 'es' : ''}</span>` : `<span class="badge badge-warn" id="proc-badge-${idx}" style="display:none"></span>`}
      </div>
    </div>

    <div class="gpu-stats">
      <div class="stat-cell">
        <div class="stat-label">GPU Utilization</div>
        <div class="stat-value ${uc}" id="val-gpu-util-${idx}">${g.gpu_utilization}</div>
        <div class="bar-wrap"><div class="bar-fill ${uc}" id="bar-gpu-util-${idx}" style="width:${gpuPct}%"></div></div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">Memory Used</div>
        <div class="stat-value ${mc}" id="val-mem-used-${idx}">${g.memory_used} <span style="color:var(--muted);font-size:.75rem">/ ${g.memory_total}</span></div>
        <div class="bar-wrap"><div class="bar-fill ${mc}" id="bar-mem-used-${idx}" style="width:${mPct}%"></div></div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">Memory Util</div>
        <div class="stat-value ${mc}" id="val-mem-util-${idx}">${g.memory_utilization}</div>
        <div class="bar-wrap"><div class="bar-fill ${mc}" id="bar-mem-util-${idx}" style="width:${pct(g.memory_utilization)}%"></div></div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">Temperature</div>
        <div class="stat-value ${tc}" id="val-temp-${idx}">${g.temperature}</div>
        <div class="bar-wrap"><div class="bar-fill ${tc}" id="bar-temp-${idx}" style="width:${Math.min(parseNum(g.temperature) || 0, 100)}%"></div></div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">Power Draw</div>
        <div class="stat-value" id="val-power-${idx}">${g.power_draw} <span style="color:var(--muted);font-size:.75rem">/ ${g.power_limit}</span></div>
        <div class="bar-wrap"><div class="bar-fill" id="bar-power-${idx}" style="width:${pwrPct}%"></div></div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">Fan Speed</div>
        <div class="stat-value" id="val-fan-${idx}">${g.fan_speed}</div>
        <div class="bar-wrap"><div class="bar-fill" id="bar-fan-${idx}" style="width:${pct(g.fan_speed)}%"></div></div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">SM Clock</div>
        <div class="stat-value" style="color:var(--text)" id="val-smclock-${idx}">${g.sm_clock}</div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">Mem Clock</div>
        <div class="stat-value" style="color:var(--text)" id="val-memclock-${idx}">${g.mem_clock}</div>
      </div>
    </div>

    <div class="proc-section">
      <div class="proc-title">
        Active Processes <span class="proc-count" id="proc-count-${idx}">${procs.length}</span>
      </div>
      <table>
        <thead><tr><th>PID</th><th>Container</th><th>Process</th><th>Type</th><th>VRAM</th></tr></thead>
        <tbody id="proc-tbody-${idx}">${procRows}</tbody>
      </table>
    </div>
  </div>`;
}

function buildProcRows(procs) {
  if (!procs.length) return `<tr><td colspan="5" class="no-procs">No active GPU processes</td></tr>`;
  return procs.map(p => `
    <tr>
      <td class="pid">${p.pid}</td>
      <td class="container">${p.container || 'host'}</td>
      <td class="name">${p.process || p.name}</td>
      <td class="type">${p.type || "C"}</td>
      <td class="mem">${p.used_memory}</td>
    </tr>`).join("");
}

function setClass(el, cls) {
  el.className = el.className.replace(/\b(green|warn|danger)\b/g, "").trim();
  if (cls) el.classList.add(cls);
}

// Update an existing card in-place — no DOM rebuild, no flicker
function updateGPUCard(g, idx) {
  const gpuPct = pct(g.gpu_utilization);
  const mPct   = memPct(g.memory_used, g.memory_total);
  const pwrPct = powerPct(g.power_draw, g.power_limit);
  const tc = tempClass(g.temperature);
  const uc = utilClass(gpuPct);
  const mc = memClass(mPct);
  const procs = g.processes || [];

  function set(id, html) {
    const el = document.getElementById(id);
    if (el && el.innerHTML !== html) el.innerHTML = html;
  }
  function setTxt(id, txt) {
    const el = document.getElementById(id);
    if (el && el.textContent !== txt) el.textContent = txt;
  }
  function setWidth(id, w) {
    const el = document.getElementById(id);
    if (el) el.style.width = w + "%";
  }

  // GPU util
  const guEl = document.getElementById(`val-gpu-util-${idx}`);
  if (guEl) { setClass(guEl, uc); set(`val-gpu-util-${idx}`, g.gpu_utilization); }
  setClass(document.getElementById(`bar-gpu-util-${idx}`), uc);
  setWidth(`bar-gpu-util-${idx}`, gpuPct);

  // Mem used
  const muEl = document.getElementById(`val-mem-used-${idx}`);
  if (muEl) { setClass(muEl, mc); set(`val-mem-used-${idx}`, `${g.memory_used} <span style="color:var(--muted);font-size:.75rem">/ ${g.memory_total}</span>`); }
  setClass(document.getElementById(`bar-mem-used-${idx}`), mc);
  setWidth(`bar-mem-used-${idx}`, mPct);

  // Mem util
  const muuEl = document.getElementById(`val-mem-util-${idx}`);
  if (muuEl) { setClass(muuEl, mc); setTxt(`val-mem-util-${idx}`, g.memory_utilization); }
  setClass(document.getElementById(`bar-mem-util-${idx}`), mc);
  setWidth(`bar-mem-util-${idx}`, pct(g.memory_utilization));

  // Temp
  const tEl = document.getElementById(`val-temp-${idx}`);
  if (tEl) { setClass(tEl, tc); setTxt(`val-temp-${idx}`, g.temperature); }
  setClass(document.getElementById(`bar-temp-${idx}`), tc);
  setWidth(`bar-temp-${idx}`, Math.min(parseNum(g.temperature) || 0, 100));

  // Power
  set(`val-power-${idx}`, `${g.power_draw} <span style="color:var(--muted);font-size:.75rem">/ ${g.power_limit}</span>`);
  setWidth(`bar-power-${idx}`, pwrPct);

  // Fan
  setTxt(`val-fan-${idx}`, g.fan_speed);
  setWidth(`bar-fan-${idx}`, pct(g.fan_speed));

  // Clocks
  setTxt(`val-smclock-${idx}`, g.sm_clock);
  setTxt(`val-memclock-${idx}`, g.mem_clock);

  // Process badge
  const badge = document.getElementById(`proc-badge-${idx}`);
  if (badge) {
    if (procs.length > 0) {
      badge.style.display = "";
      badge.textContent = `${procs.length} process${procs.length > 1 ? 'es' : ''}`;
    } else {
      badge.style.display = "none";
    }
  }

  // Process count
  setTxt(`proc-count-${idx}`, procs.length);

  // Process table — only rebuild if process list changed
  const tbody = document.getElementById(`proc-tbody-${idx}`);
  if (tbody) {
    const newRows = buildProcRows(procs);
    if (tbody.innerHTML !== newRows) tbody.innerHTML = newRows;
  }
}

async function fetchAndRender() {
  const dot        = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");
  const errEl      = document.getElementById("error-msg");
  const container  = document.getElementById("gpu-container");

  try {
    const res  = await fetch(API_URL, { cache: "no-store" });
    const data = await res.json();

    errEl.style.display = "none";

    if (data.error) {
      dot.className = "status-dot error";
      statusText.textContent = "Error";
      errEl.style.display = "block";
      errEl.textContent = "⚠ " + data.error;
      return;
    }

    dot.className = "status-dot live";
    statusText.textContent = "Live";
    document.getElementById("last-updated").textContent =
      new Date(data.timestamp).toLocaleTimeString();

    if (data.gpus && data.gpus.length > 0) {
      if (!initialized) {
        // First render — build the full DOM
        container.innerHTML = data.gpus.map((g, i) => buildGPUCard(g, i)).join("");
        initialized = true;
      } else {
        // Subsequent renders — update values in place, no flicker
        data.gpus.forEach((g, i) => updateGPUCard(g, i));
      }
    } else {
      container.innerHTML = `<div style="color:var(--muted);padding:20px 0;font-family:var(--mono)">No GPUs detected.</div>`;
    }

  } catch (e) {
    dot.className = "status-dot error";
    statusText.textContent = "Offline";
    errEl.style.display = "block";
    errEl.innerHTML = `⚠ Cannot reach the GPU server at <strong>${API_URL}</strong><br><br>
Make sure <code>gpu_server.py</code> is running:<br>
<code style="display:inline-block;margin-top:6px;padding:6px 10px;background:rgba(0,0,0,0.4);border-radius:4px">python gpu_server.py</code>`;
  }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(fetchAndRender, getInterval());
}

document.getElementById("interval-select").addEventListener("change", startPolling);

fetchAndRender();
startPolling();
</script>
</body>
</html>
